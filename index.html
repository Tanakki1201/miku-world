<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MIKU WORLD</title>
<style>
:root{
  --cyan:#00ffff;
  --white:#fff;
  --bg:#000;
}
*{box-sizing:border-box}
html,body{
  margin:0;
  width:100%;
  min-height:100%;
  background:var(--bg);
  color:var(--white);
  font-family:Arial,"Yu Gothic","Meiryo",sans-serif;
}
body{overflow-x:hidden}
.hero{
  position:relative;
  width:100vw;
  height:100vh;
  min-height:620px;
  overflow:hidden;
  background:#000;
}
.hero-image{
  position:absolute;
  inset:0;
  width:100%;
  height:100%;
  object-fit:cover;
  object-position:center;
}
.hero-shade{
  position:absolute;
  inset:0;
  pointer-events:none;
  background:
    radial-gradient(circle at 50% 42%, rgba(0,0,0,0) 34%, rgba(0,0,0,.10) 68%, rgba(0,0,0,.24) 100%),
    linear-gradient(90deg, rgba(0,0,0,.28) 0%, rgba(0,0,0,.06) 34%, rgba(0,0,0,0) 58%);
}
.header{
  position:absolute;
  inset:0 0 auto 0;
  z-index:10;
  height:100px;
}
.menu{
  position:absolute;
  top:24px;
  left:28px;
  width:40px;
  height:32px;
  border:0;
  background:transparent;
  cursor:pointer;
  padding:0;
}
.menu span{
  display:block;
  width:38px;
  height:3px;
  margin-bottom:8px;
  background:#fff;
  border-radius:99px;
}
.brand{
  position:absolute;
  top:17px;
  left:91px;
}
.brand-main{
  margin:0;
  font-size:20px;
  font-weight:700;
  letter-spacing:5px;
}
.brand-sub{
  margin:4px 0 0;
  font-size:10px;
  font-weight:600;
  letter-spacing:4px;
}
.languages{
  position:absolute;
  top:23px;
  right:30px;
  display:flex;
  gap:25px;
}
.lang{
  border:0;
  background:transparent;
  color:#fff;
  font-size:13px;
  letter-spacing:2px;
  cursor:pointer;
  padding:3px 0 10px;
}
.lang.active{color:var(--cyan)}
.lang.active::after{
  content:"";
  display:block;
  width:22px;
  height:2px;
  margin:8px auto 0;
  background:var(--cyan);
  box-shadow:0 0 8px var(--cyan);
}
.copy{
  position:absolute;
  z-index:5;
  left:3.3%;
  top:27%;
  width:410px;
}
h1{
  margin:0;
  color:#fff;
  font-size:clamp(54px,7vw,110px);
  line-height:.88;
  letter-spacing:9px;
  text-shadow:
    0 0 3px #fff,
    0 0 10px rgba(0,255,255,.80),
    0 0 30px rgba(0,255,255,.45),
    2px 3px 8px rgba(0,0,0,.78);
}
h1 span{display:block}
.subtitle{
  margin:22px 0 0;
  font-size:12px;
  font-weight:700;
  letter-spacing:4px;
  text-shadow:0 2px 7px rgba(0,0,0,.95),0 0 8px rgba(0,255,255,.18);
}
.ja-copy{
  margin:27px 0 0;
  font-size:17px;
  line-height:1.8;
  text-shadow:0 2px 8px rgba(0,0,0,.98),0 0 10px rgba(0,0,0,.55);
}
.rule{
  width:55px;
  height:1px;
  margin:18px 0 0;
  background:#fff;
}
.keywords{
  margin:16px 0 0;
  font-size:11px;
  font-weight:700;
  letter-spacing:3px;
  line-height:1.8;
  text-shadow:0 2px 8px rgba(0,0,0,.98),0 0 9px rgba(0,0,0,.50);
}
.join-area{
  position:absolute;
  z-index:8;
  left:50%;
  bottom:9%;
  width:390px;
  transform:translateX(-50%);
}
.join{
  width:100%;
  height:62px;
  border:1px solid rgba(0,255,255,.9);
  border-radius:999px;
  background:
    linear-gradient(180deg, rgba(2,12,22,.72), rgba(0,8,16,.54));
  color:#fff;
  backdrop-filter:blur(4px);
  -webkit-backdrop-filter:blur(4px);
  font-size:15px;
  font-weight:700;
  letter-spacing:2px;
  cursor:pointer;
  box-shadow:
    0 0 10px rgba(0,255,255,.36),
    0 0 28px rgba(0,255,255,.12),
    inset 0 0 24px rgba(0,255,255,.08),
    inset 0 1px 0 rgba(255,255,255,.18);
}
.join:hover{
  background:
    linear-gradient(180deg, rgba(2,18,30,.84), rgba(0,10,20,.68));
  box-shadow:
    0 0 18px rgba(0,255,255,.58),
    0 0 42px rgba(0,255,255,.18),
    inset 0 0 28px rgba(0,255,255,.11),
    inset 0 1px 0 rgba(255,255,255,.24);
}
.caption{
  margin:12px 0 0;
  padding-left:36px;
  font-size:11px;
  letter-spacing:1px;
  text-shadow:0 2px 7px rgba(0,0,0,.95);
}
.scroll{
  position:absolute;
  left:34px;
  bottom:18px;
  z-index:8;
  display:flex;
  align-items:center;
  gap:12px;
}
.scroll span:first-child{
  font-size:9px;
  font-weight:700;
  letter-spacing:3px;
}
.scroll-line{
  width:48px;
  height:1px;
  background:rgba(255,255,255,.4);
}
.modal{
  position:fixed;
  inset:0;
  z-index:100;
  display:grid;
  place-items:center;
  padding:24px;
  background:rgba(0,0,0,.72);
  opacity:0;
  visibility:hidden;
  pointer-events:none;
  transition:.25s ease;
}
.modal.open{
  opacity:1;
  visibility:visible;
  pointer-events:auto;
}
.card{
  width:min(520px,100%);
  padding:38px;
  border:1px solid rgba(0,255,255,.3);
  border-radius:18px;
  background:rgba(2,7,16,.98);
  box-shadow:0 0 50px rgba(0,0,0,.7);
}
.close{
  float:right;
  border:0;
  background:transparent;
  color:#fff;
  font-size:28px;
  cursor:pointer;
}
.kicker{
  color:var(--cyan);
  font-size:10px;
  letter-spacing:4px;
}
.card h2{
  margin:8px 0 16px;
  font-size:50px;
  letter-spacing:5px;
}
.card p{
  line-height:1.8;
  color:rgba(255,255,255,.75);
}

/* =========================================================
   MIKU WORLD — CINEMATIC POP-IN SEQUENCE
   Text appears one piece at a time, then JOIN appears last.
   ========================================================= */
.pop-item{
  opacity:0;
  transform:translateY(24px) scale(.94);
  filter:blur(8px);
  animation:mikuPopIn .85s cubic-bezier(.16,1,.3,1) forwards;
  will-change:transform,opacity,filter;
}

.pop-title{animation-delay:.35s}
.pop-subtitle{animation-delay:1.05s}
.pop-message{animation-delay:1.55s}
.pop-keywords{animation-delay:2.55s}
.pop-join{animation-delay:3.55s}

@keyframes mikuPopIn{
  0%{
    opacity:0;
    transform:translateY(24px) scale(.94);
    filter:blur(8px);
  }
  55%{
    opacity:1;
    transform:translateY(-3px) scale(1.015);
    filter:blur(0);
  }
  100%{
    opacity:1;
    transform:translateY(0) scale(1);
    filter:blur(0);
  }
}

@media (prefers-reduced-motion:reduce){
  .pop-item{
    animation:none !important;
    opacity:1 !important;
    transform:none !important;
    filter:none !important;
  }
}

.join.pop-join{
  animation-name:mikuPopIn,mikuJoinGlow;
  animation-duration:.85s,2.2s;
  animation-timing-function:cubic-bezier(.16,1,.3,1),ease-in-out;
  animation-delay:3.55s,4.45s;
  animation-iteration-count:1,infinite;
  animation-direction:normal,alternate;
}
@keyframes mikuJoinGlow{
  from{
    box-shadow:
      0 0 10px rgba(0,255,255,.36),
      0 0 28px rgba(0,255,255,.12),
      inset 0 0 24px rgba(0,255,255,.08),
      inset 0 1px 0 rgba(255,255,255,.18);
  }
  to{
    box-shadow:
      0 0 20px rgba(0,255,255,.62),
      0 0 44px rgba(0,255,255,.22),
      inset 0 0 30px rgba(0,255,255,.12),
      inset 0 1px 0 rgba(255,255,255,.25);
  }
}

@media(max-width:760px){
  .brand{left:72px}
  .brand-main{font-size:15px;letter-spacing:3px}
  .brand-sub{font-size:8px;letter-spacing:2px}
  .languages{right:12px;gap:10px}
  .lang{font-size:10px;letter-spacing:1px}
  .copy{left:6%;top:30%;width:72%}
  h1{font-size:clamp(46px,14vw,76px);letter-spacing:5px}
  .subtitle{font-size:9px;letter-spacing:2px}
  .ja-copy{font-size:14px}
  .join-area{
    left:50%;
    bottom:8%;
    width:min(90%,390px);
    transform:translateX(-50%);
  }
}
</style>
</head>
<body>

<section class="hero">
  <img class="hero-image" src="miku-world-hero-text-free.png" alt="MIKU WORLDの宇宙、地球、初音ミクのビジュアル">
  <div class="hero-shade"></div>

  <header class="header">
    <button class="menu" id="menuButton" aria-label="メニュー">
      <span></span><span></span><span></span>
    </button>

    <div class="brand">
      <p class="brand-main">MIKU WORLD</p>
      <p class="brand-sub">FOR EVERYONE</p>
    </div>

    <nav class="languages" aria-label="Language">
      <button class="lang active" data-lang="ja">JP</button>
      <button class="lang" data-lang="en">EN</button>
      <button class="lang" data-lang="id">ID</button>
      <button class="lang" data-lang="zh">ZH</button>
      <button class="lang" data-lang="es">ES</button>
    </nav>
  </header>

  <div class="copy">
    <h1 class="pop-item pop-title"><span>MIKU</span><span>WORLD</span></h1>

    <p class="subtitle pop-item pop-subtitle" data-key="subtitle">A WORLD CONNECTED BY MUSIC</p>

    <p class="ja-copy pop-item pop-message" data-key="message">
      音でつながる。<br>
      心でひろがる。<br>
      世界は、もっとやさしくなれる。
    </p>

    <div class="rule"></div>

    <p class="keywords pop-item pop-keywords" data-key="keywords">
      MUSIC<br>
      PEOPLE<br>
      CREATION
    </p>
  </div>

  <div class="join-area">
    <button class="join pop-item pop-join" id="joinButton" data-key="join">✦　JOIN MIKU WORLD →</button>
  </div>

  <div class="scroll">
    <span data-key="scroll">SCROLL</span>
    <span class="scroll-line"></span>
  </div>
</section>

<div class="modal" id="modal" role="dialog" aria-modal="true">
  <div class="card">
    <button class="close" id="closeButton" aria-label="閉じる">×</button>
    <div class="kicker">MIKU WORLD</div>
    <h2>WELCOME.</h2>
    <p data-key="modal">あなたもMIKU WORLDの一員です。音楽には国境がありません。</p>
  </div>
</div>

<script>
const translations = {
  ja:{
    subtitle:"A WORLD CONNECTED BY MUSIC",
    message:"音でつながる。<br>心でひろがる。<br>世界は、もっとやさしくなれる。",
    keywords:"MUSIC<br>PEOPLE<br>CREATION",
    join:"✦　JOIN MIKU WORLD →",
    scroll:"SCROLL",
    modal:"あなたもMIKU WORLDの一員です。音楽には国境がありません。"
  },
  en:{
    subtitle:"A WORLD CONNECTED BY MUSIC",
    message:"Connected by sound.<br>Expanded by heart.<br>The world can become kinder.",
    keywords:"MUSIC<br>PEOPLE<br>CREATION",
    join:"✦　JOIN MIKU WORLD →",
    scroll:"SCROLL",
    modal:"You are part of MIKU WORLD. Music has no borders."
  },
  id:{
    subtitle:"DUNIA YANG TERHUBUNG OLEH MUSIK",
    message:"Terhubung melalui suara.<br>Meluas melalui hati.<br>Dunia bisa menjadi lebih baik.",
    keywords:"MUSIK<br>MANUSIA<br>KREASI",
    join:"✦　GABUNG MIKU WORLD →",
    scroll:"GULIR",
    modal:"Kamu adalah bagian dari MIKU WORLD. Musik tidak memiliki batas."
  },
  zh:{
    subtitle:"一个由音乐连接的世界",
    message:"因声音相连。<br>因心而延伸。<br>世界可以变得更加温柔。",
    keywords:"音乐<br>人们<br>创作",
    join:"✦　加入 MIKU WORLD →",
    scroll:"滚动",
    modal:"你也是 MIKU WORLD 的一员。音乐没有国界。"
  },
  es:{
    subtitle:"UN MUNDO CONECTADO POR LA MÚSICA",
    message:"Conectados por el sonido.<br>Unidos por el corazón.<br>El mundo puede ser más amable.",
    keywords:"MÚSICA<br>PERSONAS<br>CREACIÓN",
    join:"✦　UNIRSE A MIKU WORLD →",
    scroll:"DESPLAZAR",
    modal:"Tú eres parte de MIKU WORLD. La música no tiene fronteras."
  }
};

function setLanguage(lang){
  const data=translations[lang] || translations.ja;
  document.documentElement.lang=lang;

  document.querySelectorAll("[data-key]").forEach(el=>{
    const key=el.dataset.key;
    if(data[key]) el.innerHTML=data[key];
  });

  document.querySelectorAll(".lang").forEach(btn=>{
    const active=btn.dataset.lang===lang;
    btn.classList.toggle("active",active);
    btn.setAttribute("aria-pressed",active);
  });
}

document.querySelectorAll(".lang").forEach(btn=>{
  btn.addEventListener("click",()=>setLanguage(btn.dataset.lang));
});

const modal=document.getElementById("modal");
const join=document.getElementById("joinButton");
const close=document.getElementById("closeButton");

join.addEventListener("click",()=>modal.classList.add("open"));
close.addEventListener("click",()=>modal.classList.remove("open"));
modal.addEventListener("click",e=>{
  if(e.target===modal) modal.classList.remove("open");
});
document.addEventListener("keydown",e=>{
  if(e.key==="Escape") modal.classList.remove("open");
});
</script>

</body>
</html>
